<div class="code-block-wrapper" data-language="{{ value.language }}">
  <div class="code-block-header">
    <div class="code-block-info">
      <span class="code-lang-tag">{{ value.language|upper }}</span>
      {% if value.title %}
      <span class="code-filename">{{ value.title }}</span>
      {% endif %}
    </div>
    <button class="copy-code-btn" type="button" aria-label="Copy code to clipboard">
      <svg class="copy-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span class="copy-text">Copy</span>
    </button>
  </div>
  <pre class="code-pre language-{{ value.language }}"><code class="language-{{ value.language }}">{{ value.code }}</code></pre>
</div>
