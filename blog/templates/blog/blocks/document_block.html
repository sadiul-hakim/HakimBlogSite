<div class="inline-doc-card">
  <div class="doc-icon-wrap">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
    </svg>
  </div>
  <div class="doc-meta">
    <a href="{{ value.document.url }}" class="doc-title" download target="_blank">
      {% if value.title %}{{ value.title }}{% else %}{{ value.document.title }}{% endif %}
    </a>
    {% if value.description %}
    <p class="doc-desc">{{ value.description }}</p>
    {% endif %}
    <span class="doc-extension">{{ value.document.file_extension|upper }} • {{ value.document.file.size|filesizeformat }}</span>
  </div>
  <a href="{{ value.document.url }}" class="doc-download-btn" download target="_blank" title="Download file">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    <span>Download</span>
  </a>
</div>
